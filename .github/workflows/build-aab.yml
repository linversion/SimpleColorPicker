name: Build AAB

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Derive version from tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "VERSION_PROPS=-PversionNameOverride=${MAJOR}.${MINOR}.${PATCH} -PversionCodeOverride=${CODE}" >> "$GITHUB_ENV"
          else
            echo "VERSION_PROPS=" >> "$GITHUB_ENV"
            echo "Tag '$GITHUB_REF_NAME' is not vX.Y.Z, building with versions from app/build.gradle"
          fi

      - name: Build productRelease AAB
        run: ./gradlew :app:bundleProductRelease --no-daemon --stacktrace $VERSION_PROPS

      - name: Rename AAB
        run: |
          mkdir -p dist
          AAB=$(ls app/build/outputs/bundle/productRelease/*.aab | head -n 1)
          cp "$AAB" "dist/SimpleColorPicker-${GITHUB_REF_NAME}.aab"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleColorPicker-${{ github.ref_name }}
          path: dist/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.aab
          generate_release_notes: true
